services:
  # 1. React Frontend (Vite SPA Static Site)
  - type: web
    name: e-waste-frontend
    runtime: static
    rootDir: "frontend"
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: e-waste-backend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. Node.js Backend API
  - type: web
    name: e-waste-backend
    env: node
    plan: free
    rootDir: "backend"
    buildCommand: "npm install"
    startCommand: "node app.js"
    healthCheckPath: "/health"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: FLASK_URL
        fromService:
          type: web
          name: e-waste-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: CV_URL
        fromService:
          type: web
          name: e-waste-cv
          envVarKey: RENDER_EXTERNAL_URL

  # 3. Python Machine Learning Service
  - type: web
    name: e-waste-ml
    env: python
    plan: free
    rootDir: "ml-service"
    buildCommand: "pip install -r requirements.txt && python train.py"
    startCommand: "gunicorn -w 1 --threads 2 --timeout 120 -b 0.0.0.0:$PORT app:app"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"

  # 4. Python Computer Vision Service
  - type: web
    name: e-waste-cv
    env: python
    plan: free
    rootDir: "cv-service"
    buildCommand: "pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
    startCommand: "gunicorn -w 1 --threads 2 --timeout 120 -b 0.0.0.0:$PORT app:app"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
